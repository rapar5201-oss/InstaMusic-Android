plugins { id 'com.android.application' }
android {
    namespace 'com.instamusic.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.instamusic.app"
        minSdk 24
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 14
        versionName project.hasProperty('versionName') ? project.property('versionName') : "1.0.14"
    }
    signingConfigs {
        permanentKey {
            storeFile file('keystore/instamusic.keystore')
            storePassword 'instamusic123'
            keyAlias 'instamusic'
            keyPassword 'instamusic123'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.permanentKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.permanentKey
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
}
