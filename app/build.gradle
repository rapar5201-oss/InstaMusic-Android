    namespace 'com.instamusic.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.instamusic.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes { debug { } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
