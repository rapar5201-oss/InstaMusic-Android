name: Build InstaMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | "/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable Release & Debug APKs
        run: |
          gradle assembleRelease assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --no-daemon

      - name: Generate version.json for In-App Updates
        run: |
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/rapar5201-oss/InstaMusic-Android/releases/download/latest-apk/app-release.apk",
            "releaseNotes": "Automatic smart music engagement push notifications: Remembers played songs in a local database and sends stylish reminders (e.g. 'Your song is missing you', 'Resume [Track]') when inactive, with movable network indicator and in-app updates."
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: InstaMusic-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          retention-days: 90

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: InstaMusic latest APK (v1.0.${{ github.run_number }})
          body: "Installable InstaMusic Android app with automatic smart music engagement push notifications (remembers played songs in SQLite database, sends stylish reminders like 'Your song is missing you' when away), movable network indicator, and in-app APK updates."
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
