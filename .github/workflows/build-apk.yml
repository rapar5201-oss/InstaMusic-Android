name: Build InstaMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | "/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable Release & Debug APKs
        run: |
          gradle assembleRelease assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --no-daemon

      - name: Generate version.json for In-App Updates
        run: |
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/rapar5201-oss/InstaMusic-Android/releases/download/latest-apk/app-release.apk",
            "releaseNotes": "Full app bundle & playback engine upgrade: bundled all design components, pages, styles and routes inside the APK for instant offline-first launch; fixed music search and playback with operational high-bitrate JioSaavn API (saavnx.vercel.app); added transparent API proxying; permanently removed watermark badge; and ensured 100% offline library playback."
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: InstaMusic-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          retention-days: 90

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: InstaMusic latest APK (v1.0.${{ github.run_number }})
          body: "InstaMusic Android release with full app bundle and working music engine: all components, pages, routes, fonts and styles packaged directly in the APK; music streaming and search restored with high-quality JioSaavn API; transparent API failover proxying; permanently hidden watermark badge; and persistent lockscreen/notification controls."
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
