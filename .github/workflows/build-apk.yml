name: Build InstaMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | "/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable Release & Debug APKs
        run: |
          gradle assembleRelease assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --no-daemon

      - name: Generate version.json for In-App Updates
        run: |
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/rapar5201-oss/InstaMusic-Android/releases/download/latest-apk/app-release.apk",
            "releaseNotes": "Native system share sheet integration for songs, verified 36 interactive settings controls with active side-effects, real-time 3-band Web Audio Equalizer (Bass/Vocal/Treble), in-app Privacy Policy and Open-Source modal sheets, Home header settings shortcut, and native haptic vibration feedback."
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: InstaMusic-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          retention-days: 90

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: InstaMusic latest APK (v1.0.${{ github.run_number }})
          body: "InstaMusic Android release v1.0.${{ github.run_number }}: Native Android share sheet integration for tracks, verified 36 functional settings controls with active side effects (themes, display toggles, accessibility, clearing search/history, cache reset), hardware-accelerated 3-band equalizer (Bass, Vocals, Treble), native reminder frequency bridge, in-app Privacy Policy and Open-Source licenses modals, Home header settings button, and haptic feedback."
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
